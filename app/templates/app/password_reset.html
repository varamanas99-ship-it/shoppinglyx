{% extends 'app/base.html' %}
{% block title %}Reset Password{% endblock title %}
{% block main-content %}
<div class="container my-5">
 <div class="row">
  <div class="col-sm-6 offset-sm-3 bg-white shadow p-4 rounded">
   <h3 class="fw-bold mb-3">Reset Password</h3>
   <form action="" method="post" novalidate>
    {% csrf_token %}
    {% for fm in form %}
     <div class="mb-3">
       
       {{ fm.label_tag }}
       {{ fm }} 
       <span class="text-danger small">{{ fm.errors|striptags }}</span>
     </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary px-4 mt-3">Send Reset Link</button>
   </form>
  </div>
 </div>
</div>
{% endblock main-content %}
