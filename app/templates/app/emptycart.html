{% extends 'app/base.html' %}
{% load static %}
{% block title %}Empty Cart{% endblock title %}

{% block main-content %}
<div class="container my-5">
 <div class="row">
  <div class="col-sm-12 text-center py-5">
    <div class="mb-4">
     
      <i class="fas fa-shopping-cart text-muted" style="font-size: 100px;"></i>
    </div>
    <h2 class="fw-bold">Your Cart is Empty!</h2>
    <p class="text-muted fs-5">Before you proceed to checkout, you must add some products to your shopping cart.</p>
    <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-5 rounded-pill mt-3 shadow">Shop Now</a>
  </div>
 </div>
</div>
{% endblock main-content %}
