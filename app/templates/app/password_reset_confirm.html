{% extends 'app/base.html' %}
{% block title %}Confirm New Password{% endblock title %}
{% block main-content %}
<div class="container my-5">
 <div class="row">
  <div class="col-sm-6 offset-sm-3 bg-white shadow p-4 rounded">
   <h3 class="fw-bold mb-3">Set New Password</h3>
   <form action="" method="post" novalidate>
    {% csrf_token %}
    {% for fm in form %}
     <div class="mb-3">
       <label class="form-label fw-semibold small">{{ fm.label_tag }}</label>
       {{ fm }} <span class="text-danger small">{{ fm.errors|striptags }}</span>
     </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary px-4 mt-3">Update Password</button>
   </form>
  </div>
 </div>
</div>
{% endblock main-content %}
